---
name: publish-gpr

"on":
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'

      - name: Validate package scope for GitHub Packages
        run: node scripts/qa/validate-package-scope.mjs

      - name: Validate git tag matches package version
        if: github.event_name == 'release'
        run: node scripts/qa/validate-tag-version.mjs

      - name: Install deps
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run strict QA gates
        run: npm run qa:strict

      - name: Run production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify package artifact contents
        run: npm pack --dry-run

      - name: Publish package to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
